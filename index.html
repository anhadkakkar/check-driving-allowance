<!DOCTYPE html>
<html>
    <head>
        <title>Driving allowance</title>
        <style>body{
    background-image: url(https://t3.ftcdn.net/jpg/04/19/69/40/240_F_419694078_ZntDEQBNrQ5U7hMtOQQ6uhrjwfRU1ZTR.jpg);
    text-align: center;
    background-repeat: no-repeat;
    background-size: cover;
}
div{
    background-color: blue;
    width: 400px;
    margin: 30px auto;
    padding: 10px;
    border-radius: 10px;
    color: white;
}
button{
    background-color: greenyellow;
    color: white;
    padding: 5px 10px;
    border: none;
    border-radius: 10px;
}
label{
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}
input{
    margin-bottom: 20px;
    width: 90%;
    box-sizing: border-box;
    padding: 5px 10px;
    border-radius: 10px;
}
p{
    color: white;
    font-size: 20px;
}
</style>
    </head>
    <body>
        <h1>Driving allowance</h1>
        <div>
            <label>enter your age</label>
            <input type="number" id="age">
            <button onclick="checkDriving()">Check allowance</button>
        </div>
        <p id="result"></p>
        <script>
            function checkDriving(){
                let ageInput = document.getElementById("age").value;
                

                if(ageInput>=18){
                    document.getElementById("result").innerHTML = "you are allowed to drive";
                }
                else{
                    document.getElementById("result").innerHTML = "you are not allowed to drive";
                }
            }
        </script>
    </body>
</html>
